# =============================================================================
# Android Build Workflow
# -----------------------------------------------------------------------------
# Builds the Capacitor Android app on an Ubuntu runner and uploads an unsigned
# debug APK as an artifact. Mirrors the iOS workflow so Android can also be
# built without a local dev environment.
#
# TODO: Add signed release build + Play Store upload when keystore secrets are
# available. When ready, add a separate job that:
#   1. Imports a keystore from a base64-encoded secret (KEYSTORE_BASE64)
#   2. Builds with `./gradlew :app:assembleRelease -Pandroid.injected.signing.*`
#   3. Uploads to Play Store with `r0adkll/upload-google-play@v1`
#
# Required secrets at that point:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD,
#   PLAY_STORE_SERVICE_ACCOUNT_JSON
# =============================================================================

name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (debug, unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Override local JDK pin (CI uses setup-java)
        working-directory: android
        run: |
          set -euxo pipefail
          # Strip the Windows-only org.gradle.java.home pin; on CI the JDK from
          # setup-java is on PATH and the toolchain resolver will pick it up.
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          cat gradle.properties

      - name: Assemble debug APK
        working-directory: android
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        working-directory: android
        run: |
          set -euxo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at android/$APK_PATH"
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          ls -la "$APK_PATH"
          echo "path=android/$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload Gradle build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports
            android/build/reports
          retention-days: 14
          if-no-files-found: ignore
