# =============================================================================
# iOS Build Workflow
# -----------------------------------------------------------------------------
# Builds the Capacitor iOS app on a macOS runner so contributors without a Mac
# (e.g. Windows / Linux users) can still produce iOS artifacts.
#
# Two parallel jobs:
#   * build-ios            -> Unsigned device build (.app packed into .ipa)
#   * build-ios-simulator  -> Debug simulator build (.app)
#
# Neither job signs or uploads to TestFlight. Both artifacts are for inspection
# / sideloading-on-simulator only.
#
# TODO: Add signing + TestFlight upload when Apple Developer account is ready.
#   When ready, between `pod install` and `xcodebuild` in `build-ios`, add:
#
#     - name: Import code-signing certificates
#       uses: apple-actions/import-codesign-certs@v3
#       with:
#         p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
#         p12-password:    ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
#
#     - name: Download provisioning profile
#       uses: apple-actions/download-provisioning-profiles@v3
#       with:
#         bundle-id:   com.ltnsali.places
#         issuer-id:   ${{ secrets.APPSTORE_ISSUER_ID }}
#         api-key-id:  ${{ secrets.APPSTORE_KEY_ID }}
#         api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
#
#   Then replace the unsigned `xcodebuild ... build` step with a signed
#   archive + export, and finally upload to TestFlight:
#
#     - name: Upload to TestFlight
#       uses: apple-actions/upload-testflight-build@v3
#       with:
#         app-path:  build/App.ipa
#         issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
#         api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
#         api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
#
#   Required secrets at that point:
#     APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
#     APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY
# =============================================================================

name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt-in to Node 24 for JavaScript actions (Node 20 deprecation 2026-09-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unsigned device build -> .app -> packed into .ipa (not distributable)
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (device, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Capacitor sync (iOS)
        # Regenerates Package.swift with macOS-correct (forward-slash) paths.
        # Capacitor 8 uses Swift Package Manager; no Podfile is generated.
        run: npx cap sync ios

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Xcode build (unsigned, device)
        run: |
          set -euxo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned .ipa
        run: |
          set -euxo pipefail
          APP_PATH="build/ios/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            ls -la build/ios/Build/Products || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr "App-unsigned.ipa" Payload
          ls -la App-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: build/App-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload Xcode build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build/ios/Logs/Build
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Simulator build -> .app (this is what TestFlight automation will later
  # replace with a signed archive + export)
  # ---------------------------------------------------------------------------
  build-ios-simulator:
    name: Build iOS (simulator, debug)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Capacitor sync (iOS)
        # Regenerates Package.swift with macOS-correct (forward-slash) paths.
        # Capacitor 8 uses Swift Package Manager; no Podfile is generated.
        run: npx cap sync ios

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-sim-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-spm-sim-

      - name: Xcode build (simulator, debug)
        run: |
          set -euxo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios-sim/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
          if-no-files-found: error

      - name: Upload Xcode build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-logs
          path: build/ios-sim/Logs/Build
          retention-days: 14
          if-no-files-found: ignore
