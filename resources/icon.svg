<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0d2042" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Solid background (Capacitor masks to rounded square / circle as needed) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle radial highlight -->
  <circle cx="320" cy="280" r="380" fill="#ffffff" opacity="0.08"/>

  <!-- Map pin -->
  <g filter="url(#pinShadow)">
    <path d="M512 220
             c-132 0 -240 108 -240 240
             0 168 240 384 240 384
             s240 -216 240 -384
             c0 -132 -108 -240 -240 -240z"
          fill="#ffffff"/>
    <circle cx="512" cy="452" r="92" fill="#4285F4"/>
  </g>
</svg>
